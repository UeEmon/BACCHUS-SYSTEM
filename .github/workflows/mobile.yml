name: Mobile app

on:
  push:
    paths: ['mobile/**', 'server/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', 'server/**', '.github/workflows/mobile.yml']
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The app against the real Python server.
      - run: flutter test test/server_contract_test.dart
        env:
          BACCHUS_SERVER_TESTS: '1'

  android:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # With the four ANDROID_* secrets set, builds are signed with the upload key;
      # without them they are debug-signed and only fit for testing.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab

  ios:
    needs: test
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Proves the iOS project compiles. Installing on iPhones or App Store upload needs
      # signing with the team's certificate (see mobile/docs/BUILD_SETUP.md).
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qr Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: mobile/build/ios/iphoneos/Runner-unsigned.zip
