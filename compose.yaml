services:
  bacchus:
    build: .
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACCHUS_PORT:-8092}:8000"
    environment:
      BACCHUS_USERS: ${BACCHUS_USERS:-}
      BACCHUS_PUBLIC_URL: ${BACCHUS_PUBLIC_URL:-}
      BACCHUS_TRUST_PROXY: ${BACCHUS_TRUST_PROXY:-}
      BACCHUS_SESSION_HOURS: ${BACCHUS_SESSION_HOURS:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - bacchus-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  bacchus-data:
